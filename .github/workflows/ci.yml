name: CI

on:
  push:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skeleton

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify runs the unit tests and the JaCoCo 70% service coverage check
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: skeleton/target/site/jacoco/
          if-no-files-found: ignore
