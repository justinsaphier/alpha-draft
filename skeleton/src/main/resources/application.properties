# Supabase PostgreSQL connection. Every value comes from an environment variable so no
# credential is committed. If a variable is missing, startup fails immediately with
# "Could not resolve placeholder". See .env.example for the names to set.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
