# Local secrets live in skeleton/.env (git-ignored; copy .env.example). Spring reads it when the
# app is started from the skeleton folder. Real environment variables take priority over it.
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL connection. Every value comes from an environment variable (or .env) so
# no credential is committed. See .env.example for the names to set. If SUPABASE_DB_URL is
# missing, startup fails with: 'url' must start with "jdbc".
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Create or update tables from the entities on startup (users, stocks, stock_audit_log), so the
# schema in Supabase always matches the JPA entities. Existing rows are kept across restarts.
spring.jpa.hibernate.ddl-auto=update

# Signing key for sign-in tokens. Must be at least 32 bytes. Set JWT_SECRET; startup fails if it is missing.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# The admin account, created (or promoted from player) on startup. Optional: leave unset and
# every account is a PLAYER.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Twelve Data API key for the closing-price job (EndOfDayPriceJob). Optional: without it the
# job logs a warning and skips the run; the app still starts. Set TWELVE_DATA_API_KEY in .env.
twelvedata.api-key=${TWELVE_DATA_API_KEY:}

# End-of-day price job: weekdays 4:30 PM New York time (the cron is set on the job itself, and can
# be overridden with app.prices.cron). Pause between calls to stay under Twelve Data's 8 calls/minute.
app.prices.request-delay-ms=8000

# Email for league messages: pick reminders, automatic picks and scored months. Leave MAIL_HOST
# empty and the messages are written to the log instead.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:alphadraft@localhost}
